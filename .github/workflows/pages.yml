name: Publicar en GitHub Pages

# Se construye AQUI, desde el repo, nunca subiendo un dist hecho en local: el
# dist local contiene tarifas-excel.json, que es justo lo que no se republica.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar que no se cuela ningun dato curado
        # Lista blanca, no negra: un fichero nuevo o renombrado ya se colo una vez
        # por comprobar solo nombres concretos.
        run: |
          malos=$(find datos app/public -maxdepth 1 -name '*.json' ! -name 'tarifas-cnmc.json' 2>/dev/null)
          if [ -n "$malos" ]; then
            echo "Hay ficheros de datos que no deberian publicarse:"
            echo "$malos"
            exit 1
          fi
          echo "Limpio: solo se publica tarifas-cnmc.json"

      - run: npm run build

      - name: Y que tampoco esta en el build
        run: |
          malos=$(find app/dist -maxdepth 1 -name '*.json' ! -name 'tarifas-cnmc.json' ! -name 'manifest.webmanifest')
          if [ -n "$malos" ]; then
            echo "El build contiene datos que no deberian publicarse:"
            echo "$malos"
            exit 1
          fi
          ls -la app/dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
